server:
  port: 8081
  tomcat:
    # 上传超限时让 Tomcat 读完请求体再返回 400，否则客户端可能只看到连接重置
    max-swallow-size: -1
spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://localhost:3306/campus_food?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.campus.food.campusfood.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: "change-me-please-change-me-please-1234567890"
  expire-minutes: 120
  header: "Authorization"
  prefix: "Bearer "

app:
  upload:
    dir: ./uploads

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
