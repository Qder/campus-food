server:
  port: 8084

spring:
  application:
    name: social-service
  datasource:
    url: jdbc:mysql://localhost:3306/campus_food?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  data:
    redis:
      host: localhost
      port: 6379

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.campus.food.campusfood.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: "change-me-please-change-me-please-1234567890"
  expire-minutes: 120
  header: "Authorization"
  prefix: "Bearer "

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
