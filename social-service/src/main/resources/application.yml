server:
  port: 8084

spring:
  application:
    name: social-service
  datasource:
    url: jdbc:mysql://localhost:3306/campus_food?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  data:
    redis:
      host: localhost
      port: 6379
    mongodb:
      # 打开后启动时按实体上的 @CompoundIndex 建索引，默认 false
      auto-index-creation: true
  # 聊天消息正文；会话与消息索引仍走 MySQL 的 campus_food 库
  # Spring Boot 4.x 起连接属性根从 spring.data.mongodb 迁到 spring.mongodb
  mongodb:
    uri: mongodb://localhost:27017/campus_food_chat

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.campus.food.campusfood.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: "change-me-please-change-me-please-1234567890"
  expire-minutes: 120
  header: "Authorization"
  prefix: "Bearer "

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
